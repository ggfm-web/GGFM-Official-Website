    <rect x="230" y="198" width="290" height="16" rx="8" fill="#D8CEAE" />

    <rect x="118" y="266" width="470" height="72" rx="14" fill="#252525" stroke="#363636" stroke-width="1.5" />
    <text x="150" y="312" fill="#D8CEAE" font-family="sans-serif" font-size="26" font-weight="800">#02</text>
    <rect x="230" y="294" width="240" height="16" rx="8" fill="#569429" fill-opacity="0.8" />

    <rect x="118" y="362" width="470" height="72" rx="14" fill="#252525" stroke="#363636" stroke-width="1.5" />
    <text x="150" y="408" fill="#a8a8a8" font-family="sans-serif" font-size="26" font-weight="800">#03</text>
    <rect x="230" y="390" width="195" height="16" rx="8" fill="#569429" fill-opacity="0.55" />

    <rect x="118" y="458" width="470" height="72" rx="14" fill="#252525" stroke="#363636" stroke-width="1.5" />
    <text x="150" y="504" fill="#a8a8a8" font-family="sans-serif" font-size="26" font-weight="800">#04</text>
    <rect x="230" y="486" width="148" height="16" rx="8" fill="#363636" />

    <rect x="118" y="554" width="470" height="72" rx="14" fill="#252525" stroke="#363636" stroke-width="1.5" />
    <text x="150" y="600" fill="#646464" font-family="sans-serif" font-size="26" font-weight="800">#05</text>
    <rect x="230" y="582" width="110" height="16" rx="8" fill="#363636" />
  </g>

  <!-- Vinyl disc & chart arc on right -->
  <g transform="translate(865, 385)">
    <circle r="205" fill="#111111" stroke="#363636" stroke-width="2.5" />
