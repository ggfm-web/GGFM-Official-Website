<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" fill="none">
  <defs>
    <radialGradient id="glow-hitlist" cx="72%" cy="38%" r="48%">
      <stop offset="0%" stop-color="#569429" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#191919" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1200" height="750" fill="#191919" />
  <rect width="1200" height="750" fill="url(#glow-hitlist)" />
  <rect x="44" y="44" width="1112" height="662" rx="18" stroke="#363636" stroke-width="2" />

  <!-- Ascending chart cadence rows on left -->
